id: kernel-opaque-struct
language: c
severity: error
message: The kernel's public headers declare its state opaque; define this struct in a private header in tinyactors-host/src/.
note: |
  A binding reaches the kernel's state (the system, the scheduler, the
  input log, loads, the trace encoder, ...) only through functions, so it
  cannot depend on the kernel's layout (kernel ADR 0001, "Step 2b"). The
  public header keeps `typedef struct tah_x tah_x;` and the body goes in
  src/<module>_private.h, which only the kernel's sources and tests
  include. A struct body stays public only when it is data the binding
  fills or reads: a parameter record, a record or view handed out, a
  snapshot of counters, a table of callbacks, or a container a binding
  embeds. Name such a type in `data-type` below, in the same change.
  `mise run check-opaque` in tinyactors-host scans its headers.
utils:
  data-type:
    regex: ^(tah_io_registration|tah_memory_counters|tah_layout|tah_slice|tah_vec|tah_ring_shape|tah_ring|tah_map|tah_free_list|tah_definition_totals|tah_effect|tah_id_page|tah_exemplar|tah_histogram|tah_load_route|tah_load_ask|tah_load_request|tah_load_info|tah_loads_stats|tah_load_finish|tah_wake_fire|tah_offload_put_params|tah_param_info|tah_params|tah_platform_vtable|tah_platform|tah_replay_event_params|tah_record|tah_record_wake|tah_record_texts|tah_jump|tah_message_jump|tah_message|tah_settlement|tah_turn_record|tah_sched_note|tah_sched_observer|tah_turn_budgets|tah_turn_params|tah_sched_transfer_params|tah_sched_attach_params|tah_dead_post|tah_waiting_post|tah_queued_message|tah_sched_stats|tah_pump_driver|tah_child_params|tah_unreachable|tah_router_failure|tah_system_load_finish|tah_quarantine_report|tah_system_callbacks|tah_system_create_params|tah_trace_watch_set_params|tah_trace_watch_sizes)$
rule:
  kind: struct_specifier
  has:
    field: body
    kind: field_declaration_list
  not:
    any:
      # struct tah_turn_record { ... }
      - has:
          field: name
          matches: data-type
      # typedef struct { ... } tah_message; and the structs nested in it
      - inside:
          kind: type_definition
          stopBy: end
          has:
            field: declarator
            matches: data-type
