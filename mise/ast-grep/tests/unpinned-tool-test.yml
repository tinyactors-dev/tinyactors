id: unpinned-tool
valid:
  - "Toolchain::Tool[:llvm_nm].run('-g', object)"
  - "system('git', 'status')"
  - "run('mise', 'run', 'build')"
  - "capture!('gh', 'release', 'download', tag)"
  - "puts 'nm'"
  - "names = ['file', 'nm']"
  - "TOOLS = %w[nm ar]"
  - "Cache.files('file', '-x')"
  - "record(root, 'tar', status)"
invalid:
  - "Open3.capture2e('nm', '-g', '--defined-only', object)"
  - "run('ar', 'rcs', out)"
  - "capture!('llvm-objdump', '--macho', '--dylibs-used', shared)"
  - "Cache.preprocessed_digest(['cc', '-std=c11', '-Iinclude'], source)"
  - "IO.popen({ 'ZERO_AR_DATE' => '1' }, ['ar', 'rcs', out], &:read)"
  - "Open3.capture2({ 'A' => '1' }, 'tar', '-xzf', archive)"
  - "Open3.capture2('readelf', '-d', library)"
  - "system('which', name, out: File::NULL)"
  - "run('sysctl', '-n', 'hw.memsize')"
  - "Open3.capture3(*%w[nm -g], object)"
  - "COMMAND = ['clang', '-std=c11', '-Iinclude']"
  - "IO.popen(['cc', '-E', source], &:read)"
