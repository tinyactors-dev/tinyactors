# A function of the public headers takes at most three parameters
# (AGENTS.md, "At most three parameters"; docs/adr/0009 in the repository
# root): what travels together is grouped in a struct (ta_bytes, ta_buffer,
# ta_spawn, ...). Run with `mise run lint`.
id: at-most-three-parameters
language: c
severity: error
message: "a public function takes at most three parameters; group the rest in a struct (AGENTS.md)"
files:
  - include/**/*.h
rule:
  kind: function_declarator
  has:
    kind: parameter_list
    has:
      kind: parameter_declaration
      nthChild: {position: 4, ofRule: {kind: parameter_declaration}}
  inside:
    kind: declaration
    stopBy: end
    has: {field: type, regex: '^TA_API$'}
