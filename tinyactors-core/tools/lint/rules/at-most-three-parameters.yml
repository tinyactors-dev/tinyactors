# A function of the public headers takes at most three parameters, and so
# does a callback they declare (a function pointer: a vtable entry, a
# typedef) (AGENTS.md, "At most three parameters"; docs/adr/0009 in the
# repository root): what travels together is grouped in a struct (ta_bytes,
# ta_buffer, ta_spawn, ta_datamodel_call, ...). Run with `mise run lint`.
id: at-most-three-parameters
language: c
severity: error
message: "a public function or callback takes at most three parameters; group the rest in a struct (AGENTS.md)"
files:
  - include/**/*.h
rule:
  kind: function_declarator
  has: {matches: four-or-more-parameters} # tools/lint/utils/
  any:
    - inside:
        kind: declaration
        stopBy: end
        has: {field: type, regex: '^TA_API$'}
    - has: {kind: parenthesized_declarator} # a callback: (*name)(...)
