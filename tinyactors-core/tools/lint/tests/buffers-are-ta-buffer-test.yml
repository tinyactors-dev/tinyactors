id: buffers-are-ta-buffer
valid:
  - "TA_API ta_status ta_host_snapshot(ta_host *h, ta_buffer *out);"
  - "TA_API ta_status ta_host_wake(ta_host *h, uint64_t session, ta_bytes blob);"
  - "TA_API ta_status ta_host_actor(ta_host *h, uint32_t segment, uint64_t *session);"
  - "TA_API ta_string_view ta_cbor_string(const ta_cbor_document *document, uint32_t at);"
  - "static size_t helper(void *buffer, size_t capacity);"
  - "TA_API void ta_wasm_free(void *pointer, size_t size, size_t alignment);"
  - "TA_API ta_bytes ta_image_bytes(const ta_image *image);"
  - "TA_API const char *ta_name(const ta_image *image, uint32_t index);"
  - "typedef struct v { ta_status (*serialize)(const ta_datamodel_call *call, ta_buffer *out); } v;"
  - "typedef struct ta_allocator { void *(*alloc)(void *context, size_t size, size_t align); void (*free)(void *context, void *ptr, size_t size); } ta_allocator;"
  - |
    /* The envelope, a view of the host's memory, valid until the next call into the host. */
    TA_API ta_status ta_host_envelope(ta_host *h, const ta_host_effect *effect, ta_bytes *out);
  - |
    /* Traces and logs: views of the host's memory, valid until the next call. */
    TA_API ta_status ta_host_traces(ta_host *h, ta_bytes *out);
    TA_API ta_status ta_host_logs(ta_host *h, ta_bytes *out);
  - |
    typedef struct v {
        /* to_wire: a view the datamodel owns, valid until its next call */
        ta_status (*to_wire)(void *datamodel, ta_payload p, ta_bytes *out);
    } v;
  - |
    /* A writing: its bytes in `out`, valid until the next call. */
    typedef ta_status (*ta_writer)(void *context, ta_bytes *out);
invalid:
  - "typedef struct v { ta_status (*serialize)(void *d, uint64_t i, void *buffer, size_t capacity); } v;"
  - "typedef struct v { ta_status (*load)(void *d, const void *buffer, size_t length); } v;"
  - "TA_API ta_status ta_host_snapshot(ta_host *h, void *buffer, size_t capacity);"
  - "TA_API uint32_t ta_address_name_decode(ta_string_view name, char *buffer, uint32_t capacity);"
  - "TA_API ta_status ta_actor_wake(ta_system *system, const void *blob, size_t length);"
  - "TA_API size_t ta_otlp_put_traces(ta_otlp *otlp, void *out, size_t size);"
  - "TA_API ta_status ta_parse(const uint8_t *bytes, size_t length, ta_buffer *out);"
  - "TA_API const void *ta_image_bytes(const ta_image *image, size_t *length);"
  - "TA_API ta_status ta_host_envelope(ta_host *h, const ta_host_effect *effect, ta_bytes *out);"
  - |
    /* The envelope, in the host's memory. */
    TA_API ta_status ta_host_envelope(ta_host *h, const ta_host_effect *effect, ta_bytes *out);
  - |
    /* Traces: a view, valid until the next call. */
    TA_API ta_status ta_host_traces(ta_host *h, ta_bytes *out);
    /* Logs. */
    TA_API ta_status ta_host_logs(ta_host *h, ta_bytes *out);
  - "typedef struct v { ta_status (*to_wire)(void *datamodel, ta_payload p, ta_bytes *out); } v;"
  - "typedef ta_status (*ta_writer)(void *context, ta_bytes *out);"
