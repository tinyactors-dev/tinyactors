<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>copywriter · tinyactors</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; font-display: swap; src: url(/assets/fonts/IBMPlexSans-400.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 500; font-display: swap; src: url(/assets/fonts/IBMPlexSans-500.woff2) format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url(/assets/fonts/IBMPlexMono-500.woff2) format('woff2'); }
  @font-face { font-family: 'Newsreader'; font-weight: 400; font-display: swap; src: url(/assets/fonts/Newsreader-400.woff2) format('woff2'); }
  :root {
    color-scheme: light dark;
    --paper: #F4EEE2; --card: #FAF6EE; --ink: #2A2622; --muted: #5C544B; --subtle: #766C60;
    --line: #DACEB8; --line-2: #C9BAA0; --pine: #1F5E4A; --pine-hover: #194D3D; --on-pine: #FFF8F0; --code: #EEE7D9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #18120D; --card: #201811; --ink: #F1E6D2; --muted: #CBBBA2; --subtle: #A38F76;
      --line: #45362A; --line-2: #5B4838; --pine: #5FAE8F; --pine-hover: #86C4AB; --on-pine: #120D09; --code: #120D09;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 400 16px/1.6 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top, 0px)) 16px calc(56px + env(safe-area-inset-bottom, 0px)); }
  h1 { font: 400 44px/1.05 Newsreader, Georgia, serif; letter-spacing: -0.02em; margin: 0 0 40px; }
  section { border-top: 1px solid var(--line); padding: 24px 0 32px; }
  .button {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 2px;
    background: var(--pine); color: var(--on-pine); font-weight: 500; font-size: 14px; text-decoration: none;
  }
  .button:hover { background: var(--pine-hover); }
  .button svg { width: 16px; height: 16px; }
  ol { margin: 20px 0 0; padding: 0; list-style: none; counter-reset: step; }
  li { counter-increment: step; display: grid; grid-template-columns: 28px 1fr; color: var(--muted); padding: 4px 0; }
  li::before { content: counter(step); font: 500 13px/1.85 'IBM Plex Mono', ui-monospace, monospace; color: var(--subtle); }
  code { font: 500 13px/1 'IBM Plex Mono', ui-monospace, monospace; background: var(--code); border: 1px solid var(--line); border-radius: 1px; padding: 2px 5px; color: var(--ink); }
  label.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; font-weight: 500; }
  label.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track { flex: none; position: relative; width: 44px; height: 24px; border-radius: 12px; background: var(--line-2); transition: background .18s cubic-bezier(.2,0,0,1); }
  .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 2px rgba(40,30,20,.3); transition: transform .18s cubic-bezier(.2,0,0,1); }
  input:checked + .track { background: var(--pine); }
  input:checked + .track::after { transform: translateX(20px); }
  input:focus-visible + .track { outline: 2px solid var(--pine); outline-offset: 2px; }
  .back { display: inline-block; margin-top: 8px; color: var(--muted); font-size: 14px; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>copywriter</h1>

  <section aria-label="Chrome extension">
    <a class="button" href="/copywriter/copywriter-extension.zip" download data-download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
      Download extension
    </a>
    <ol>
      <li><span>Unzip it.</span></li>
      <li><span>Open <code>chrome://extensions</code>.</span></li>
      <li><span>Turn on Developer mode, then Load unpacked.</span></li>
    </ol>
  </section>

  <section aria-label="This device">
    <label class="switch">
      <span>Use on this device</span>
      <input type="checkbox" role="switch" id="use">
      <span class="track" aria-hidden="true"></span>
    </label>
  </section>

  <a class="back" href="/">← tinyactors</a>
</main>
<script>
  // The site loads /copywriter/embed.js on every page of a device that
  // turned it on here (localStorage `tinyactors-copywriter`).
  (() => {
    const KEY = 'tinyactors-copywriter';
    const use = document.getElementById('use');
    try { use.checked = localStorage.getItem(KEY) === 'on'; } catch { use.disabled = true; }
    use.addEventListener('change', () => {
      try {
        localStorage.setItem(KEY, use.checked ? 'on' : 'off');
      } catch { use.checked = false; }
    });
  })();
</script>
</body>
</html>
