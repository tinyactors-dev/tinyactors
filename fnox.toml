# Secrets for releases, read by fnox (`fnox exec -- <command>`) from the
# 1Password vault "Claude Code" with the environment's service account
# (OP_SERVICE_ACCOUNT_TOKEN). This file holds references, never a value.
# mise.toml pins fnox and the 1Password CLI.

[providers.op]
type = "1password"
vault = "Claude Code"

# npm's token for publishing @tinyactors packages (staged: the maintainer
# approves each version on npmjs.com).
[secrets.NPM_TOKEN]
provider = "op"
value = "npm-token/password"

# Cloudflare's token for deploying the staticjs site
# (staticjs/mise/tasks/site/deploy runs wrangler through fnox).
[secrets.CLOUDFLARE_API_TOKEN]
provider = "op"
value = "tinyactors.dev Cloudflare API token/credential"

# exe.dev's API key for the presence server's VM (ta-presence): its HTTP
# API, POST https://exe.dev/exec (website/presence, mise run presence:*).
[secrets.EXE_API_KEY]
provider = "op"
value = "tinyactors-exe-api-key/notesPlain"

# tinyactors-support's GitHub App (tinyactors-support/AGENTS.md): its id,
# its OAuth client, and its private key (the PEM, in the item's notes).
# `mise run secrets` in tinyactors-support writes them to the VM's
# environment; the server runs on its stand-ins without them.
[secrets.GITHUB_APP_ID]
provider = "op"
value = "tinyactors-support GitHub App/app-id"

[secrets.GITHUB_APP_CLIENT_ID]
provider = "op"
value = "tinyactors-support GitHub App/client-id"

[secrets.GITHUB_APP_CLIENT_SECRET]
provider = "op"
value = "tinyactors-support GitHub App/client-secret"

[secrets.GITHUB_APP_PRIVATE_KEY]
provider = "op"
value = "tinyactors-support GitHub App/notesPlain"

# The maintainer's Google AI Studio key, for the copywriter's end-to-end
# tests and copy evals against Gemini (copywriter/, mise run e2e).
[secrets.GEMINI_API_KEY]
provider = "op"
value = "tinyactors-copywriter-gemini/credential"

# TypeSafe's API key for Jev, the decision model tinyactors-support asks
# whether a report is an issue it already has (console.typesafe.ai).
[secrets.TYPESAFE_API_KEY]
provider = "op"
value = "console.typesafe.ai API Key/credential"
