# The website, https://www.tinyactors.dev: content in XML (content/),
# its schema (schema/site.xsd), the XSLT that renders it (render/site.xsl)
# and the layout over the design system (style/site.css). Tasks are Ruby
# file tasks in mise/tasks/ (the root AGENTS.md).

[tools]
# sxml validates the content against its XSD 1.1 schema and runs the XSLT
# 4.0 stylesheet that writes the pages (https://sxml.tinyactors.dev).
"github:tinyactors-dev/sxml" = "0.2.0"
# Node.js runs the examples the pages show (examples/, with the packages
# they import from npm), the local server and wrangler, which deploys.
node = "22"
# Python and uv run the examples' Python programs (examples/*/main.py)
# against the tinyactors their uv.lock pins from PyPI.
python = "3.13"
uv = "0.12.22"
