<!doctype html><meta charset="utf-8"><title>anthill spike</title>
<script type="module">
const q = Object.fromEntries(new URLSearchParams(location.search));
const opts = { n: Number(q.n ?? 10000), seconds: Number(q.seconds ?? 10), datamodel: q.datamodel ?? 'native' };
try {
  if (q.worker) {
    const w = new Worker('./browser-bench.mjs', { type: 'module' });
    await new Promise((r) => { w.onmessage = r; });
    window.result = await new Promise((r) => { w.onmessage = (e) => r(e.data); w.postMessage(opts); });
  } else {
    const { bench } = await import('./browser-bench.mjs');
    window.result = await bench(opts);
  }
} catch (error) { window.result = { error: String(error?.stack ?? error) }; }
</script>
