# tinyparse's tasks are the file tasks in mise/tasks/ (Ruby); the toolchain
# is the root mise.toml's: the pinned clang and llvm-tools for what runs
# here, zig cc for what is shipped (Toolchain::Target.release).
#
#   mise run build       the library, the CLI, the harness and the examples
#   mise run test        build, then the suite over the xfail ledger
#   mise run dist        the libraries and the CLI for every release target
#   mise run release     the release tarballs in dist/release/
