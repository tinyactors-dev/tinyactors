name: tinyparse

# Build, gate, and (on a tag) release tinyparse.
#
# tinyparse is cross-built for BOTH platforms from a single Linux host with
# Zig 0.15.1 — the decision is cross-from-Linux, so there is no macOS runner.
# This workflow is scoped to tinyparse/**; it never runs for changes elsewhere
# in the monorepo. It is kept here, under tinyparse/.github/, until it is wired
# into the monorepo's own .github/workflows/; its paths are already written
# relative to the monorepo root.
#
# What runs, and when:
#   - push / pull_request under tinyparse/**          -> BUILD GATE only.
#   - push of a tag matching tinyparse-v*           -> gate + GitHub Release.
#   - workflow_dispatch (manual)                      -> gate + GitHub Release.
#
# The gate is ci/tinyparse-metric.sh; a non-zero (any FAIL) result fails the
# job, so a tag build cannot ship a red tree. release.sh assembles the three
# release tarballs into tinyparse/dist/release/; internally it calls
# amalgamate.sh to produce the single-file amalgamation that goes into the
# amalgamation tarball. Every run uploads those tarballs as build artifacts;
# only a tinyparse-v* tag (or a manual dispatch) attaches them to a Release.

on:
  # Manual build + release from the Actions tab or `gh workflow run`.
  workflow_dispatch:
  push:
    # Tag builds publish a Release...
    tags:
      - 'tinyparse-v*'
    # ...and a normal push under the project runs the gate only.
    paths:
      - 'tinyparse/**'
  pull_request:
    paths:
      - 'tinyparse/**'

# One in-flight run per ref; a newer push supersedes an older one, except on
# tags, where every release build must complete.
concurrency:
  group: tinyparse-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Default read-only token; the release step elevates contents to write below so
# only that path can publish.
permissions:
  contents: read

jobs:
  build:
    name: Build, gate, and package
    runs-on: ubuntu-latest

    # Allow the release step to create/update a GitHub Release and upload
    # assets with the default GITHUB_TOKEN.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Provision the pinned Zig 0.15.1 with the repo's own setup script, for
      # fidelity with what the metric proves locally. TINYPARSE_SETUP=1 forces
      # the fetch in CI; the script installs to
      # tinyparse/.toolchain/zig/zig, which build.sh discovers.
      - name: Provision Zig 0.15.1
        run: TINYPARSE_SETUP=1 bash tinyparse/ci/tinyparse-setup.sh

      # The gate. It builds the dist matrix and runs the data-driven suite over
      # the xfail ledger, exiting non-zero on any FAIL — which fails this job,
      # so a tag build never ships a red tree.
      - name: Run the build gate
        run: bash tinyparse/ci/tinyparse-metric.sh

      # Assemble the three release tarballs into tinyparse/dist/release/.
      # release.sh invokes amalgamate.sh to fold the library into the
      # single-file tinyparse.c for the amalgamation tarball.
      - name: Build release tarballs
        run: bash tinyparse/release.sh tarballs

      # Keep the packaged artifacts on every run, including PRs, so a reviewer
      # can download exactly what a release would ship.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tinyparse-release
          path: tinyparse/dist/release/*
          if-no-files-found: error

      # Publish only on a tinyparse-v* tag or a manual dispatch. Attaches the
      # three tarballs to the Release for that tag with the default token.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/tinyparse-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: tinyparse/dist/release/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
