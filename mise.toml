monorepo_root = true

[monorepo]
config_roots = ["tinyactors-core", "tinyactors-test", "tinyactors-napi", "tinyactors-cpython", "tinyxml", "tinyparse", "staticjs", "staticjs-js"]

[tools]
ruby = "4"
# The toolchain is LLVM 22, and nothing else: clang compiles every program
# that runs here (Toolchain::Target.host), every check (Target.check), the
# sanitizer builds and the API extractor; LLVM's binutils (llvm-nm,
# llvm-readobj, llvm-ar, ...) read and archive every object, ELF, Mach-O
# and wasm alike. Nothing uses the host's cc, nm, ar, readelf or otool, and
# $CC is not read (mise/lib/toolchain/). Move both pins together;
# `mise run toolchain-test` fails when they are different releases. The
# API extractor reads clang's JSON AST, whose shape changes between major
# releases (clang 22 dropped the ElaboratedType wrapper around a typedef's
# tag), so a new major regenerates the descriptions in include/.
clang = "22"
"conda:llvm-tools" = "22"
# GNU tar and gzip, so a release tarball is the same bytes on every host
# (macOS ships bsdtar and another gzip).
"conda:tar" = "1.35"
"conda:gzip" = "1.14"
# The static analysis of the build scripts (mise run check-portability).
ast-grep = "0.45.3"
# Node.js, the same from every directory: it runs the wasm release test
# (wasm:test) and the torture chamber's server test (torture:test).
node = "22"
# Every release binary is built with `zig cc` (docs/adr/0001): one compiler,
# linker, compiler-rt and C library for every target, from any host
# (Toolchain::Target.release). It is LLVM too (21 in zig 0.16), and LLVM
# 22's tools read what it builds.
zig = "0.16.0"

[env]
# Puts the workspace's shared task library (mise/lib/) on Ruby's load path so
# every module's task files can `require 'cache'` and `require 'task_stamp'`
# without a per-module placeholder file or a brittle `../../../` relative
# path back to the root. `{{config_root}}` is the workspace root here (this is
# the root config, not a module's), and mise propagates root [env] into tasks
# belonging to every config_roots module, whether run from inside the module
# or as `//module:task` from the root. A task script run directly, without
# mise, will now fail with a LoadError instead of silently working, since
# RUBYLIB only comes from mise's environment; that is acceptable because
# Cache::ROOT already depends on mise's MISE_PROJECT_ROOT. A task that spawns
# another task script as a child Ruby process (e.g. tinyxml/mise/tasks/generated)
# still works, since the child inherits RUBYLIB from the parent's environment.
RUBYLIB = "{{config_root}}/mise/lib"
# Every task reads and writes UTF-8 (the sources, the tasks' own output, the
# arrows check-acronyms prints), whatever the locale. Under the POSIX locale a
# CI runner or a bare container starts with, Ruby takes US-ASCII as the
# external encoding, and the first non-ASCII line a task reads raised
# "invalid byte sequence in US-ASCII" instead of reporting what it found.
RUBYOPT = "-EUTF-8"
