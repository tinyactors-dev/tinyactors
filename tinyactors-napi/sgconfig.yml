# ast-grep project of tinyactors-napi (invoke as `ast-grep`; in orbs `sg`
# is shadow-utils' group tool). `mise run lint` runs the rules' tests, then
# scans src/ and lib/ with the rules.
#
# Two of the rules are the repository's (AGENTS.md, "At most three
# parameters"), applied to all of the addon's C rather than to public
# headers: they match through tinyactors-core's utility rules
# (four-or-more-parameters, bytes-as-pointer-and-length, allocator-signature),
# so the patterns are core's and are written once. The others are this
# binding's own (AGENTS.md, "C rules"): the layers, one timer,
# the ta_napi_ prefix, no mutable globals, and the convenience layer's
# imports (lib/convenience.mjs imports only lib/direct.mjs). The wasm
# module's C layer (wasm/src/) has the first three and no-mutable-globals,
# and rules of its own: the ta_web_ prefix, its calls (core, txml, a few of
# the C library's) and allocation only in its allocator.
ruleDirs:
  - tools/lint/rules
utilDirs:
  - tools/lint/utils
  - ../tinyactors-core/tools/lint/utils
testConfigs:
  - testDir: tools/lint/tests
