# The convenience layer (lib/, but lib/direct.mjs) is JavaScript over the
# direct layer's exports only (AGENTS.md, "Layers and the resolver";
# docs/plan.xml, phase p3: "nothing in it calls the addon other than
# through its exports"). It imports one module, lib/direct.mjs, which
# loads the addon and exports its items and nothing else, so what the
# convenience layer can call is what an application can call. Refused:
# any other specifier (a package, a `node:` built-in, the addon's `.node`
# file, index.mjs, a path out of lib/), a computed or dynamic import
# (`import(path)`, `require(name)`), and loading code around the module
# system (`createRequire`, `process.dlopen`, `process.getBuiltinModule`).
# A shape that needs a built-in (a resolver reading files) widens this
# rule in its own commit, with its reason.
id: convenience-imports-the-direct-layer
language: javascript
severity: error
message: "the convenience layer imports only the direct layer's exports ('./direct.mjs'): no other module, path, package, built-in, .node file or computed import"
files:
  - lib/**/*.mjs
ignores:
  - lib/direct.mjs
rule:
  any:
    # import ... from '<specifier>'; export ... from '<specifier>'
    - all:
        - kind: string
        - any:
            - inside: {kind: import_statement}
            - inside: {kind: export_statement}
        - not: {regex: '^[''"]\./direct\.mjs[''"]$'}
    # import('<specifier>') and require('<specifier>'), whatever the specifier
    - all:
        - kind: call_expression
        - has: {field: function, regex: '^(import|require)$'}
    - pattern: process.dlopen($$$ARGUMENTS)
    - pattern: process.getBuiltinModule($$$ARGUMENTS)
    - pattern: createRequire($$$ARGUMENTS)
