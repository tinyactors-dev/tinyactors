# The addon allocates almost nothing (AGENTS.md, "The binding's memory";
# tinyactors-core/docs/bindings.md, section 6; ADR 0010): malloc, calloc,
# realloc and free are called only by the tables of rows
# (src/datamodel/handles.c) and by host.c's create (ta_napi_host_new),
# free (ta_napi_host_finalize) and the allocator (ta_napi_host_alloc,
# ta_napi_host_free_block). A writer or a room that outgrows the stack
# grows through that allocator (ta_napi_allocator), not by a call of its
# own: nothing per call, per event or per evaluation beyond that growth.
# Bytes are borrowed, an image is copied once into a block of the
# allocator's, a session, a chart or a payload is a row.
id: allocation-in-tables-and-host
language: c
severity: error
message: "the C library's allocator is called only in src/datamodel/handles.c and in host.c's create, free and allocator (AGENTS.md, \"The binding's memory\"): use a writer or a room of the call's (they grow through ta_napi_allocator), borrow, or a row"
files:
  - src/**/*.c
  - src/**/*.h
ignores:
  - src/datamodel/handles.c
rule:
  kind: call_expression
  has:
    field: function
    kind: identifier
    regex: '^(malloc|calloc|realloc|free)$'
  not:
    inside:
      kind: function_definition
      stopBy: end
      has:
        field: declarator
        any:
          - kind: function_declarator
          - kind: pointer_declarator
        has:
          stopBy: end
          field: declarator
          kind: identifier
          regex: '^(ta_napi_host_new|ta_napi_host_finalize|ta_napi_host_alloc|ta_napi_host_free_block)$'
