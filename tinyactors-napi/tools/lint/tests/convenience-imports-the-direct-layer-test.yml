id: convenience-imports-the-direct-layer
valid:
  - "import { Host } from '#direct';"
  - "import * as direct from \"#direct\";"
  - "export { Host } from '#direct';"
  - "export const name = 'node:fs';"
  - "const label = '../build/not-an-import.node';"
  - "const fs = get.call(globalThis.process, 'node:fs');"
  - "const fs = process.getBuiltinModule('node:fs');"
  - "const path = globalThis.process.getBuiltinModule(\"node:path\");"
invalid:
  - "import addon from '../build/tinyactors.node';"
  - "import { Host } from '../index.mjs';"
  - "import { Host } from './direct.mjs';"
  - "import { Host } from '@tinyactors/node';"
  - "import { readFileSync } from 'node:fs';"
  - "import { readFileSync } from 'fs';"
  - "import { readFile } from 'node:fs/promises';"
  - "import { join } from 'path';"
  - "import { join } from 'node:path/posix';"
  - "import { spawn } from 'node:child_process';"
  - "import { tmpdir } from 'node:os';"
  - "import cbor from 'cbor-x';"
  - "import { Host } from '#direct?raw';"
  - "import { other } from './other.mjs';"
  - "export * from './other.mjs';"
  - "const direct = await import('#direct');"
  - "const addon = await import(path);"
  - "const addon = require('../build/tinyactors.node');"
  - "process.dlopen(module, '../build/tinyactors.node');"
  - "const os = process.getBuiltinModule('node:os');"
  - "const vm = process.getBuiltinModule(name);"
  - "const require = createRequire(import.meta.url);"
