[project]
name = "tinyactors-mcp"
version = "0.0.0"
description = "A Model Context Protocol server over running tinyactors hosts: inspect, send, read traces, snapshot, rehearse and deploy chart versions"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyactors_mcp"]

[tool.uv]
package = false
