# ast-grep project of tinyactors-cpython (invoke as `ast-grep`; in orbs
# `sg` is shadow-utils' group tool). `mise run lint` runs the rules' tests,
# then scans src/ with the rules.
#
# Two of the rules are the repository's (AGENTS.md, "At most three
# parameters"), applied to all of the binding's C rather than to public
# headers: they match through tinyactors-core's utility rules
# (four-or-more-parameters, bytes-as-pointer-and-length, allocator-signature),
# so the patterns are core's and are written once. The others are this
# binding's gates (ROADMAP.md, step 8, "Gates"): the layers, one timer,
# and the ta_python_ prefix.
ruleDirs:
  - tools/lint/rules
utilDirs:
  - tools/lint/utils
  - ../tinyactors-core/tools/lint/utils
testConfigs:
  - testDir: tools/lint/tests
