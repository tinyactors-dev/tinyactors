id: adapter-imports-public-module-python
valid:
  - "import tinyactors"
  - "import tinyactors as ta"
  - "from tinyactors import Host, Address, UNDEFINED, TinyactorsError"
  - "from tinyactors import Host as H"
  - "import struct, sys"
  - "import importlib"
  - "from . import frames"
  - "from .frames import read_frame"
  - "print(sys.path)"
  - "import os.path, concurrent.futures as futures"
  - "from collections.abc import Mapping"
  - "from __future__ import annotations"
  - "frames = tinyactors.decode(body)"
invalid:
  - "import tinyactors._values"
  - "import tinyactors.values as values"
  - "from tinyactors.values import decode"
  - "from tinyactors import _host"
  - "from tinyactors import Host, _host as h"
  - "import ctypes"
  - "from ctypes import CDLL"
  - "import cffi"
  - "import _tinyactors"
  - "from importlib.machinery import ExtensionFileLoader"
  - "import importlib.util"
  - "from .. import build"
  - "from ..src import values"
  - "sys.path.insert(0, 'build')"
  - "sys.path.append('build')"
  - "sys.path = ['build']"
  - "sys.path += ['build']"
  - "import cbor2"
  - "from cbor2 import loads"
  - "import numpy as np"
  - "import _json"
  - "import _ctypes"
  - "codec = __import__('cbor2')"
  - "codec = importlib.import_module('cbor2')"
  - "codec = import_module('cbor2')"
