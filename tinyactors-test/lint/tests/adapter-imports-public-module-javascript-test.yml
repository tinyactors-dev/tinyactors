id: adapter-imports-public-module-javascript
valid:
  - "import { Host, SimulatedClock } from '@tinyactors/node';"
  - "import * as tinyactors from \"@tinyactors/node\";"
  - "import process from 'node:process';"
  - "import { Buffer } from 'node:buffer';"
  - "import { readSync } from 'node:fs';"
  - "const { encode, decode } = await import('@tinyactors/node');"
  - "export const name = 'cbor-x';"
  - "export { Host } from '@tinyactors/node';"
  - "const tinyactors = await import('@tinyactors/node');"
  - "const { Host } = require('@tinyactors/node');"
  - "const label = './build/not-an-import.node';"
invalid:
  - "import addon from './build/tinyactors.node';"
  - "import { Host } from './index.mjs';"
  - "import { values } from './src/values.mjs';"
  - "import x from '../tinyactors-core/build/thing.mjs';"
  - "import x from '/opt/tinyactors/index.mjs';"
  - "import { internal } from '@tinyactors/node/internal';"
  - "export { Host } from './index.mjs';"
  - "const addon = await import('./build/tinyactors.node');"
  - "const addon = await import(path);"
  - "const addon = require('./build/tinyactors.node');"
  - "const addon = require(name);"
  - "process.dlopen(module, './build/tinyactors.node');"
  - "const require = createRequire(import.meta.url);"
  - "import cbor from 'cbor-x';"
  - "import { encode } from 'cbor';"
  - "import fs from 'fs';"
  - "import { dlopen } from 'bun:ffi';"
  - "const cbor = require('cbor-x');"
  - "const cbor = await import('cbor-x');"
  - "export { encode } from 'cbor-x';"
