# The modules of Python's standard library an adapter may import: the
# public names of sys.stdlib_module_names on the interpreter the adapter
# runs on (CPython 3.13, tinyactors-cpython's pin and this project's), and
# __future__. A private module (_ctypes, _json) is not in it. A dotted
# name matches by its first part (os.path, concurrent.futures).
# test/lint_test.rb checks the list against the pinned interpreter; on a
# new pin, write it again from
#   python -c "import sys; print(sorted(m for m in sys.stdlib_module_names if not m.startswith(chr(95))))"
id: python-standard-library
language: python
rule:
  regex: "^(__future__|abc|antigravity|argparse|array|ast|asyncio|atexit|base64|bdb|\
    binascii|bisect|builtins|bz2|cProfile|calendar|cmath|cmd|code|codecs|\
    codeop|collections|colorsys|compileall|concurrent|configparser|\
    contextlib|contextvars|copy|copyreg|csv|ctypes|curses|dataclasses|\
    datetime|dbm|decimal|difflib|dis|doctest|email|encodings|ensurepip|enum|\
    errno|faulthandler|fcntl|filecmp|fileinput|fnmatch|fractions|ftplib|\
    functools|gc|genericpath|getopt|getpass|gettext|glob|graphlib|grp|gzip|\
    hashlib|heapq|hmac|html|http|idlelib|imaplib|importlib|inspect|io|\
    ipaddress|itertools|json|keyword|linecache|locale|logging|lzma|mailbox|\
    marshal|math|mimetypes|mmap|modulefinder|msvcrt|multiprocessing|netrc|\
    nt|ntpath|nturl2path|numbers|opcode|operator|optparse|os|pathlib|pdb|\
    pickle|pickletools|pkgutil|platform|plistlib|poplib|posix|posixpath|\
    pprint|profile|pstats|pty|pwd|py_compile|pyclbr|pydoc|pydoc_data|\
    pyexpat|queue|quopri|random|re|readline|reprlib|resource|rlcompleter|\
    runpy|sched|secrets|select|selectors|shelve|shlex|shutil|signal|site|\
    smtplib|socket|socketserver|sqlite3|sre_compile|sre_constants|sre_parse|\
    ssl|stat|statistics|string|stringprep|struct|subprocess|symtable|sys|\
    sysconfig|syslog|tabnanny|tarfile|tempfile|termios|textwrap|this|\
    threading|time|timeit|tkinter|token|tokenize|tomllib|trace|traceback|\
    tracemalloc|tty|turtle|turtledemo|types|typing|unicodedata|unittest|\
    urllib|uuid|venv|warnings|wave|weakref|webbrowser|winreg|winsound|\
    wsgiref|xml|xmlrpc|zipapp|zipfile|zipimport|zlib|zoneinfo)(\\.|$)"
