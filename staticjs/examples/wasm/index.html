<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>staticjs in the browser</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    textarea, pre { width: 100%; box-sizing: border-box; font: 14px/1.4 ui-monospace, monospace; }
    pre { background: #f4f4f4; padding: 0.75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>staticjs in the browser</h1>
  <p>Serve this directory with <code>staticjs.wasm</code> and <code>staticjs.api.json</code> beside it
     (for example <code>python3 -m http.server</code>), then open it.</p>
  <textarea id="source" rows="6">[{ name: "ada", age: 36 }, { name: "grace", age: 85 }]
  .toSorted((a, b) => b.age - a.age)
  .map((p) => p.name)</textarea>
  <p>
    <label><input type="checkbox" id="module"> module</label>
    <label>output <select id="output-kind"><option>source</option><option>json</option></select></label>
    <button id="run">Evaluate</button> <button id="stop" disabled>Stop</button>
  </p>
  <pre id="output"></pre>
  <script type="module">
    import { load } from './staticjs.mjs';

    const [wasm, api] = await Promise.all([
      fetch('staticjs.wasm').then((r) => r.arrayBuffer()),
      fetch('staticjs.api.json').then((r) => r.json()),
    ]);
    const staticjs = await load(wasm, api);
    const context = staticjs.createContext();
    const output = document.getElementById('output');
    const run = document.getElementById('run');
    const stop = document.getElementById('stop');
    let evaluation = null;

    // Run in slices of 100,000 units of fuel, and give the page back between
    // them: it keeps painting and answering clicks, Stop included.
    run.addEventListener('click', async () => {
      evaluation?.cancel();
      let program;
      try {
        program = context.compile(document.getElementById('source').value,
          { module: document.getElementById('module').checked });
        evaluation = program.start({}, { output: document.getElementById('output-kind').value });
      } catch (error) {
        output.textContent = error.message;
        return;
      } finally {
        program?.release();
      }
      const current = evaluation;
      stop.disabled = false;
      try {
        while (current.run(100_000) === 'paused') {
          output.textContent = `running: ${current.fuelUsed.toLocaleString()} units`;
          await new Promise((resolve) => setTimeout(resolve));
          if (current.state !== 'paused') return;   // stopped, or replaced by a newer run
        }
        output.textContent = `${current.result}\n\n${current.fuelUsed.toLocaleString()} units of fuel`;
      } catch (error) {
        output.textContent = error.message;
      } finally {
        if (evaluation === current) stop.disabled = true;
      }
    });
    stop.addEventListener('click', () => {
      evaluation?.cancel();
      stop.disabled = true;
      output.textContent = 'stopped';
    });
  </script>
</body>
</html>
