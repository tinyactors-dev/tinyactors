<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style><style>.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px}.a{border:1.25px solid var(--fg-1);background:var(--surface-1);padding:10px;display:grid;gap:6px}.a b{font:500 12px var(--font-mono)}.a span{display:flex;gap:6px;align-items:center;font:400 11px var(--font-mono);color:var(--fg-2)}.a span i{width:6px;height:6px;border-radius:50%;background:var(--c)}</style></head><body><div class="g ta-dof" id="g"></div><script>
const A=[['gateway','running','var(--state-running)'],['auth','waiting','var(--state-waiting)'],['checkout.1','running','var(--state-running)'],['checkout.2','done','var(--state-done)'],['ledger','running','var(--state-running)'],['mailer','stopped','var(--state-stopped)'],['indexer','waiting','var(--state-waiting)'],['billing','running','var(--state-running)']];
const g=document.getElementById('g');A.forEach(a=>{const d=document.createElement('div');d.className='a';d.style.setProperty('--c',a[2]);d.innerHTML='<b>'+a[0]+'</b><span><i></i>'+a[1]+'</span>';g.appendChild(d);});
const P=[0,1,2,4,7,2,3];let k=0;const go=()=>{[...g.children].forEach((e,i)=>e.classList.toggle('is-focus',i===P[k%P.length]));k++;};go();setInterval(go,1800);
</script></body></html>
