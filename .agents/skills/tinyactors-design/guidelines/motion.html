<!-- @dsCard group="Spacing" viewport="700x220" name="Motion" subtitle="Step easing, short durations. Transitions read like state changes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style></head><body><style>@keyframes mv{0%,15%{transform:translateX(0)}45%,65%{transform:translateX(420px)}95%,100%{transform:translateX(0)}}.m{height:28px;display:flex;align-items:center;gap:12px;font:400 11px var(--font-mono);color:var(--fg-3)}.m i{display:block;width:20px;height:20px;border-radius:2px;background:var(--accent)}.tr{flex:1;position:relative;height:1px;background:var(--border-1)}.tr i{position:absolute;top:-10px}</style><div class="m"><span style="width:200px"><b style="color:var(--fg-1);font-weight:500">--ease-step</b><br>cubic-bezier(.2,0,0,1) · 140ms</span><div class="tr"><i style="animation:mv 2.4s cubic-bezier(.2,0,0,1) infinite"></i></div></div><div style="height:24px"></div><div class="m"><span style="width:200px"><b style="color:var(--fg-1);font-weight:500">--ease-out</b><br>cubic-bezier(.16,1,.3,1) · 220ms</span><div class="tr"><i style="animation:mv 2.4s cubic-bezier(.16,1,.3,1) infinite"></i></div></div><div style="height:24px"></div><div class="m"><span style="width:200px"><b style="color:var(--fg-1);font-weight:500">--ease-move</b><br>cubic-bezier(.45,0,.2,1) · 700ms</span><div class="tr"><i style="animation:mv 3.2s cubic-bezier(.45,0,.2,1) infinite"></i></div></div></body></html>
