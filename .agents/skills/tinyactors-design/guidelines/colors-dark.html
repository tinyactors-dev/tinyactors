<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style></head><body><div data-theme="dark" style="background:var(--bg-grid),var(--bg-app);color:var(--fg-1);padding:20px;border:1.5px solid var(--rule);display:flex;gap:16px;align-items:center"><div style="flex:1"><div style="font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-3)">dark</div><div style="font:400 30px/1.1 var(--font-serif);letter-spacing:-.02em;margin-top:8px">Actors, as a library.</div><div style="font:400 14px var(--font-sans);color:var(--fg-2);margin-top:6px">Same semantic tokens, re-pointed.</div></div><span style="font:500 11px var(--font-mono);padding:4px 7px;color:var(--state-running);background:var(--state-running-bg)">● running</span><span style="font:500 11px var(--font-mono);padding:4px 7px;color:var(--state-waiting);background:var(--state-waiting-bg)">● waiting</span><span style="font:500 11px var(--font-mono);padding:4px 7px;color:var(--state-done);background:var(--state-done-bg)">● done</span><span style="font:500 11px var(--font-mono);padding:4px 7px;color:var(--state-error);background:var(--state-error-bg)">● error</span><span style="background:var(--accent);color:var(--fg-on-accent);font:var(--type-ui);padding:10px 14px;border-radius:2px">Install</span></div></body></html>
