<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style></head><body><div class="sw" style="gap:8px"><div class="s"><i style="background:var(--bg-sunken);border:1px solid var(--border-1)"></i><b>bg-sunken</b></div><div class="s"><i style="background:var(--bg-app);border:1px solid var(--border-1)"></i><b>bg-app</b></div><div class="s"><i style="background:var(--surface-1);border:1px solid var(--border-1)"></i><b>surface-1</b></div><div class="s"><i style="background:var(--surface-2);border:1px solid var(--border-1)"></i><b>surface-2</b></div><div class="s"><i style="background:var(--surface-3);border:1px solid var(--border-1)"></i><b>surface-3</b></div><div class="s"><i style="background:var(--surface-inverse);border:1px solid var(--border-1)"></i><b>surface-inverse</b></div></div></body></html>
