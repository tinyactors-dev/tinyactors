<!-- @dsCard group="Brand" viewport="700x330" name="Icon pack" subtitle="Favicons, apple-touch, PWA + maskable (80% safe zone dashed) — assets/brand/" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--umber-950)}
.c{color:var(--parchment-500)!important}.c b{color:var(--parchment-100)!important}.lbl{color:var(--parchment-500)!important}
.r{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.c{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font:400 10px/1.2 var(--font-mono);color:var(--fg-3)}
.c b{font-weight:500;color:var(--fg-1)}
.px{image-rendering:pixelated}
.m{position:relative;width:132px;height:132px}
.m img{width:100%;height:100%;display:block}
.m.round img{border-radius:50%}
.m i{position:absolute;inset:10%;border:1px dashed var(--state-error);border-radius:50%}
.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-4);padding:0 0 8px}
</style></head><body>
<div class="lbl">favicon · apple-touch</div>
<div class="r" style="margin-bottom:20px">
<div class="c"><img src="../assets/brand/favicon/favicon-16.png" width="16" height="16"><b>16</b></div>
<div class="c"><img src="../assets/brand/favicon/favicon-32.png" width="32" height="32"><b>32</b></div>
<div class="c"><img src="../assets/brand/favicon/favicon-48.png" width="48" height="48"><b>48</b></div>
<div class="c"><img class="px" src="../assets/brand/favicon/favicon-16.png" width="64" height="64"><b>16 @4×</b></div>
<div class="c"><img src="../assets/brand/favicon/favicon.svg" width="64" height="64"><b>favicon.svg</b></div>
<div class="c"><img src="../assets/brand/favicon/apple-touch-icon.png" width="90" height="90" style="border-radius:20px"><b>apple-touch 180</b></div>
</div>
<div class="lbl">pwa · maskable</div>
<div class="r">
<div class="c"><div class="m" style="background:var(--vellum-100)"><img src="../assets/brand/pwa/icon-512.png"></div><b>icon-512 · any</b></div>
<div class="c"><div class="m"><img src="../assets/brand/pwa/maskable-vellum-512.png"><i></i></div><b>maskable-vellum</b></div>
<div class="c"><div class="m round"><img src="../assets/brand/pwa/maskable-vellum-512.png"></div><b>… circle mask</b></div>
<div class="c"><div class="m"><img src="../assets/brand/pwa/maskable-pine-512.png" style="border-radius:28px"></div><b>maskable-pine · squircle</b></div>
</div>
</body></html>
