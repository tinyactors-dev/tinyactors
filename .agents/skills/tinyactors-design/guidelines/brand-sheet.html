<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style></head><body><style>.r{position:absolute;width:14px;height:14px}.r::before,.r::after{content:"";position:absolute;background:var(--rule)}.r::before{left:6.5px;top:0;width:1px;height:14px}.r::after{top:6.5px;left:0;height:1px;width:14px}.r i{position:absolute;inset:3px;border:1px solid var(--rule);border-radius:50%}</style><div style="position:relative;height:180px;padding:14px;background:var(--bg-app)"><span class="r" style="left:7px;top:7px"><i></i></span><span class="r" style="right:7px;top:7px"><i></i></span><span class="r" style="left:7px;bottom:7px"><i></i></span><span class="r" style="right:7px;bottom:7px"><i></i></span><div style="position:relative;height:100%;border:1.5px solid var(--rule);background:var(--surface-1);display:flex;align-items:flex-end;padding:18px 22px"><div style="position:absolute;inset:4px;border:.5px solid var(--border-2)"></div><span style="font:400 36px/1 var(--font-serif);letter-spacing:-.02em">Run to completion.</span></div></div></body></html>
