<!-- @dsCard group="Colors" viewport="700x170" name="Lifecycle states" subtitle="Actor state semantics — running / waiting / done / error / stopped" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style></head><body><div class="sw" style="gap:8px"><div class="s"><i style="background:var(--state-running-bg);border:1px solid var(--state-running);display:flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--state-running)">● running</i><b>--state-running</b><span>+ --state-running-bg</span></div><div class="s"><i style="background:var(--state-waiting-bg);border:1px solid var(--state-waiting);display:flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--state-waiting)">● waiting</i><b>--state-waiting</b><span>+ --state-waiting-bg</span></div><div class="s"><i style="background:var(--state-done-bg);border:1px solid var(--state-done);display:flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--state-done)">● done</i><b>--state-done</b><span>+ --state-done-bg</span></div><div class="s"><i style="background:var(--state-error-bg);border:1px solid var(--state-error);display:flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--state-error)">● error</i><b>--state-error</b><span>+ --state-error-bg</span></div><div class="s"><i style="background:var(--state-stopped-bg);border:1px solid var(--state-stopped);display:flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--state-stopped)">● stopped</i><b>--state-stopped</b><span>+ --state-stopped-bg</span></div></div></body></html>
