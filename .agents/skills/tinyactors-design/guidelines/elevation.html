<!-- @dsCard group="Spacing" viewport="700x240" name="Paper levels" subtitle="Depth from paper, not light. Only level 3 casts a shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px}.sw{display:flex;gap:2px}.s{flex:1;display:flex;flex-direction:column;gap:6px;font:400 11px/1.2 var(--font-mono);color:var(--fg-3)}.s i{display:block;height:64px;border-radius:2px}.s b{font-weight:500;color:var(--fg-1)}</style><style>.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;align-items:end;padding:28px 10px 0;height:200px;box-sizing:border-box}.lv>div{display:grid;gap:8px}.lv i{display:block;height:110px;box-sizing:border-box;position:relative}.lv b{font:500 11px var(--font-mono);color:var(--fg-1)}.lv span{font:400 10px/1.3 var(--font-mono);color:var(--fg-3)}</style></head><body style="background:var(--bg-grid),var(--bg-app)"><div class="lv">
<div><i class="ta-paper-0" style="border:1px dashed var(--border-2);background:transparent"></i><b>0 · desk</b><span>--paper-0 · grid</span></div>
<div><i class="ta-paper-1" style="transform:translateY(-6px)"></i><b>1 · sheet</b><span>cards, panels · --edge-1</span></div>
<div><i class="ta-paper-2" style="transform:translateY(-14px)"><em style="position:absolute;inset:20px 16px;border:1.25px solid var(--fg-1);opacity:.35"></em></i><b>2 · overlay</b><span>vellum, live state · --edge-2</span></div>
<div><i class="ta-paper-3" style="transform:translateY(-24px)"></i><b>3 · loupe</b><span>menus, tips · --edge-3</span></div>
<div><i style="background:var(--surface-1);box-shadow:var(--shadow-dialog);transform:translateY(-24px)"></i><b>dialog</b><span>--shadow-dialog</span></div>
</div></body></html>
