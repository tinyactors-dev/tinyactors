<!-- @dsCard group="Components" viewport="760x480" name="Control rhythm" subtitle="Every interactive control on one baseline, sm / md / lg + disabled" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><style>body{padding:20px;margin:0}.g{display:grid;grid-template-columns:56px 1fr;gap:16px 12px;align-items:center}.row{display:flex;align-items:center;gap:8px;position:relative}.row>*{flex:none}.row .ta-field{width:150px}.lbl{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--fg-4)}.guide .row::before{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:1px dashed var(--state-error);opacity:.5;pointer-events:none}.hr{grid-column:1/-1;border-top:1px solid var(--border-1)}.checks{display:flex;align-items:center;gap:16px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch, Tabs } = window.TinyactorsDesignSystem_2f489e;
const Row = ({ size, disabled }) => <div className="row">
<Button variant="primary" size={size} disabled={disabled} icon="play">Start</Button>
<Button size={size} disabled={disabled}>Restart</Button>
<Button variant="ghost" size={size} disabled={disabled}>Ghost</Button>
<Button variant="danger" size={size} disabled={disabled}>Kill</Button>
<IconButton icon="ellipsis" label="More" variant="secondary" size={size} disabled={disabled} />
<Input size={size} disabled={disabled} placeholder="Filter…" icon="search" />
<Select size={size} disabled={disabled} options={['permanent','transient']} />
</div>;
function App(){ const [g,setG]=React.useState(new URLSearchParams(location.search).has('guide')); return <div className={'g'+(g?' guide':'')}>
<span className="lbl">sm · 26</span><Row size="sm" />
<span className="lbl">md · 32</span><Row size="md" />
<span className="lbl">lg · 40</span><Row size="lg" />
<div className="hr" />
<span className="lbl">Disabled</span><Row size="md" disabled />
<div className="hr" />
<span className="lbl">Choice</span><div className="row checks"><Checkbox label="Timers" defaultChecked /><Checkbox label="Off" /><Checkbox label="Disabled" disabled defaultChecked /><Radio name="r" label="one_for_one" defaultChecked /><Radio name="r" label="Disabled" disabled /><Switch label="Live" defaultChecked /><Switch label="Disabled" disabled /></div>
<span className="lbl">Tabs</span><div className="row" style={{gap:16}}><Tabs items={[{value:'e',label:'Events',count:128},'State','Mailbox']} /><Tabs variant="segmented" items={['Chart','Tree','JSON']} /></div>
<span className="lbl" onClick={()=>setG(!g)} style={{cursor:'pointer'}}>Guide</span><span className="lbl" style={{color:'var(--fg-4)'}}>Click to toggle centerline guides</span>
</div>; }
ReactDOM.createRoot(root).render(<App />);
</script></body></html>
